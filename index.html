<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>4-Shift Roster</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e9ecef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.app{max-width:480px;margin:0 auto;background:#fff;min-height:100vh;padding:20px 16px}
.screen{display:none}
.screen.active{display:block}
h4,h5{font-weight:700}
.btn-primary{background:#0d6efd;border:none;border-radius:12px;padding:14px;font-weight:600;width:100%;color:#fff;font-size:1rem}
.btn-nav{width:38px;height:38px;border-radius:50%;border:2px solid #dee2e6;background:#fff;font-size:1.2rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.dash-card{background:#fff;border:2px solid #e9ecef;border-radius:16px;padding:24px 12px;text-align:center;cursor:pointer;transition:.2s}
.dash-card:hover{border-color:#0d6efd;transform:translateY(-3px)}
.dash-card .icon{font-size:2.2rem;margin-bottom:6px}
.badge-shift{display:inline-block;padding:6px 10px;border-radius:8px;font-weight:700;font-size:.8rem;text-align:center;min-width:45px}
.shift-day{background:#FFE69C;color:#664d03}
.shift-night{background:#B6D4FE;color:#084298}
.shift-off{background:#DEE2E6;color:#495057}
.master-table{border-radius:12px;overflow:hidden;border:1px solid #e9ecef}
.master-header{display:grid;grid-template-columns:80px 1fr 1fr 1fr 1fr;gap:4px;padding:10px 8px;background:#f8f9fa;font-weight:700;font-size:.7rem;text-transform:uppercase;color:#6c757d}
.master-row{display:grid;grid-template-columns:80px 1fr 1fr 1fr 1fr;gap:4px;padding:9px 8px;border-bottom:1px solid #f0f0f0;align-items:center;font-size:.85rem}
.master-date{font-weight:600;font-size:.8rem}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-weight:700;font-size:.7rem;color:#6c757d;margin-bottom:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{aspect-ratio:1;border-radius:10px;padding:4px;font-size:.75rem;cursor:pointer;border:2px solid transparent;background:#f8f9fa;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.15s;font-weight:500;position:relative}
.cal-cell:hover{border-color:#0d6efd}
.cal-cell.today{border-color:#0d6efd!important}
.cal-cell.day{background:#FFE69C}
.cal-cell.night{background:#B6D4FE}
.cal-cell.off{background:#DEE2E6;color:#666}
.cal-num{font-weight:700;font-size:.9rem}
.cal-shift{font-size:.6rem;font-weight:600}
.note-dot{position:absolute;top:4px;right:5px;width:7px;height:7px;background:#dc3545;border-radius:50%}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin:10px 0 14px}
.month-title{font-size:1.1rem;font-weight:700}
.form-control,.form-select{border-radius:10px;border:2px solid #e9ecef;padding:10px 12px;font-size:.9rem;width:100%}
.row{display:flex;flex-wrap:wrap;margin:-4px}
.col-6{width:50%;padding:4px}
.mb-3{margin-bottom:12px}
.d-flex{display:flex}
.justify-content-between{justify-content:space-between}
.align-items-center{align-items:center}
.me-1{margin-right:4px}
.me-2{margin-right:8px}
.btn-sm{padding:6px 12px;font-size:.8rem;border-radius:8px}
.btn-outline-secondary{border:1px solid #6c757d;color:#6c757d;background:#fff}
.btn-outline-danger{border:1px solid #dc3545;color:#dc3545;background:#fff}
.text-muted{color:#6c757d}
</style>
</head>
<body>
<div class="app">
<div id="screenSetup" class="screen active">
<h4 style="margin-bottom:18px">⚙️ Roster Setup</h4>
<div class="mb-3"><label style="font-weight:600;font-size:.8rem">Roster Start Date</label><input type="date" id="startDate" class="form-control"></div>
<div class="mb-3"><label style="font-weight:600;font-size:.8rem">Forecast End Date</label><input type="date" id="endDate" class="form-control"></div>
<p style="font-size:.8rem;color:#6c757d;margin-bottom:8px">Starting position (1-8) for each crew:</p>
<div class="row">
<div class="col-6"><label style="font-weight:600;font-size:.75rem">Shift 1</label><select id="s1pos" class="form-select"></select></div>
<div class="col-6"><label style="font-weight:600;font-size:.75rem">Shift 2</label><select id="s2pos" class="form-select"></select></div>
<div class="col-6"><label style="font-weight:600;font-size:.75rem">Shift 3</label><select id="s3pos" class="form-select"></select></div>
<div class="col-6"><label style="font-weight:600;font-size:.75rem">Shift 4</label><select id="s4pos" class="form-select"></select></div>
</div>
<div style="margin-top:16px"><button id="btnSaveConfig" class="btn-primary">Save & Continue →</button></div>
</div>

<div id="screenDashboard" class="screen">
<div class="d-flex justify-content-between align-items-center" style="margin-bottom:20px"><h4>📋 Dashboard</h4><div><button id="btnExport" class="btn btn-sm btn-outline-secondary me-1">📥</button><button id="btnReset" class="btn btn-sm btn-outline-danger">🔄</button></div></div>
<div class="row"><div class="col-6"><div id="cardMaster" class="dash-card"><div class="icon">📊</div><h6>Master Table</h6><small class="text-muted">Monthly roster</small></div></div><div class="col-6"><div id="cardCalendar" class="dash-card"><div class="icon">📅</div><h6>Calendar</h6><small class="text-muted">Grid + notes</small></div></div></div>
<div style="margin-top:20px;padding:14px;background:#f8f9fa;border-radius:12px;font-size:.8rem;color:#666">⏱ 8-Day Cycle: <b>D1 → D2 → N1 → N2 → O1 → O2 → O3 → O4</b></div>
</div>

<div id="screenMaster" class="screen">
<div class="d-flex align-items-center" style="margin-bottom:8px"><button id="btnBackMaster" class="btn-nav me-2">←</button><h5>Master Roster</h5></div>
<div class="month-nav"><button id="btnMasterPrev" class="btn-nav">‹</button><span id="masterMonthLabel" class="month-title"></span><button id="btnMasterNext" class="btn-nav">›</button></div>
<div class="master-table"><div class="master-header"><span>Date</span><span>S1</span><span>S2</span><span>S3</span><span>S4</span></div><div id="masterContent" style="max-height:55vh;overflow-y:auto"></div></div>
</div>

<div id="screenCalendar" class="screen">
<div class="d-flex align-items-center" style="margin-bottom:8px"><button id="btnBackCal" class="btn-nav me-2">←</button><h5>Calendar View</h5></div>
<div class="month-nav"><button id="btnCalPrev" class="btn-nav">‹</button><span id="calMonthLabel" class="month-title"></span><button id="btnCalNext" class="btn-nav">›</button></div>
<div class="cal-weekdays"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
<div id="calGrid" class="cal-grid"></div>
<p style="font-size:.7rem;color:#999;margin-top:8px">Tap day to manage notes · 🔴 = note</p>
</div>
</div>

<div class="modal fade" id="noteModal" tabindex="-1">
<div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content" style="border-radius:16px"><div class="modal-header border-0"><h6 class="modal-title fw-bold" id="noteTitle"></h6><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><textarea id="noteInput" class="form-control" rows="3" placeholder="Your note..."></textarea></div><div class="modal-footer border-0"><button id="btnDeleteNote" class="btn btn-sm btn-outline-danger me-auto">🗑 Delete</button><button id="btnSaveNote" class="btn btn-sm btn-primary">Save</button></div></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>

</script>
</body>
</html>
