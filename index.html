<!-- NOTE MODAL -->

<!-- Service Worker Registration -->
<script>
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('data:application/javascript,' + encodeURIComponent(
    "const C='roster-v2';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['./'])));self.skipWaiting()});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(n=>n!==C).map(n=>caches.delete(n)))));self.clients.claim()});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(res.ok){const clone=res.clone();caches.open(C).then(c=>c.put(e.request,clone))}return res}).catch(()=>caches.match(e.request))))});"
  ));

</script>

<!-- Main App Script -->
<script>
(function(){
// Constants
const CYCLE_NAMES = ["Day 1","Day 2","Night 1","Night 2","Off 1","Off 2","Off 3","Off 4"];
const CYCLE_SHORT = ["D1","D2","N1","N2","O1","O2","O3","O4"];
const CYCLE_TYPE  = ["day","day","night","night","off","off","off","off"];
const STORAGE_KEY = "roster4shift";

// State
let config = {
  start: '2025-01-06',
  end: '2027-12-31',
  s1: 1, s2: 2, s3: 3, s4: 4
};
let notes = {};
let viewMonth = new Date();

// PWA Install
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});

window.installApp = function() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(result) {
      document.getElementById('installBanner').classList.remove('show');
      deferredPrompt = null;
    });
  } else {
    alert('To install: tap Share → Add to Home Screen');
  }
};

window.addEventListener('appinstalled', function() {
  document.getElementById('installBanner').classList.remove('show');
  deferredPrompt = null;
});

// Helper functions
function fmtDate(d) { return d.toISOString().slice(0,10); }
function parseDate(s) { return new Date(s + 'T00:00:00'); }
function daysBetween(d1, d2) { return Math.floor((d2 - d1) / 86400000); }

function getShift(dateStr, crewPos) {
  const startDate = parseDate(config.start);
  const targetDate = parseDate(dateStr);
  const diffDays = daysBetween(startDate, targetDate);
  const index = ((crewPos - 1 + diffDays) % 8 + 8) % 8;
  return {
    name: CYCLE_NAMES[index],
    short: CYCLE_SHORT[index],
    type: CYCLE_TYPE[index]
  };
}

// Storage
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ config: config, notes: notes }));
}

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try {
      const data = JSON.parse(raw);
      config = data.config;
      notes = data.notes || {};
    } catch(e) {}
  }
  document.getElementById('startDate').value = config.start;
  document.getElementById('endDate').value = config.end;
  document.getElementById('s1pos').value = config.s1;
  document.getElementById('s2pos').value = config.s2;
  document.getElementById('s3pos').value = config.s3;
  document.getElementById('s4pos').value = config.s4;
  viewMonth = parseDate(config.start);
}

// Populate dropdowns
function populateDropdowns() {
  const options = CYCLE_NAMES.map(function(name, i) {
    return '<option value="' + (i+1) + '">' + (i+1) + ' - ' + name + '</option>';
  }).join('');
  document.getElementById('s1pos').innerHTML = options;
  document.getElementById('s2pos').innerHTML = options;
  document.getElementById('s3pos').innerHTML = options;
  document.getElementById('s4pos').innerHTML = options;
}

// Screen navigation
function showScreen(id) {
  var screens = ['screenSetup','screenDashboard','screenMaster','screenCalendar'];
  screens.forEach(function(s) {
    document.getElementById(s).classList.remove('active');
  });
  document.getElementById(id).classList.add('active');
  if (id === 'screenMaster') renderMaster();
  if (id === 'screenCalendar') renderCalendar();
}

// Render Master Table
function renderMaster() {
  var y = viewMonth.getFullYear();
  var m = viewMonth.getMonth();
  document.getElementById('masterMonthLabel').textContent = 
    new Date(y, m).toLocaleString('default', {month:'long', year:'numeric'});
  
  var monthStart = new Date(y, m, 1);
  var monthEnd = new Date(y, m+1, 0);
  var rangeStart = new Date(Math.max(monthStart, parseDate(config.start)));
  var rangeEnd = new Date(Math.min(monthEnd, parseDate(config.end)));
  
  var html = '';
  if (rangeStart > rangeEnd) {
    html = '<div style="padding:20px;text-align:center;color:#999">No shifts in this month</div>';
  } else {
    var cur = new Date(rangeStart);
    while (cur <= rangeEnd) {
      var ds = fmtDate(cur);
      var s1 = getShift(ds, config.s1);
      var s2 = getShift(ds, config.s2);
      var s3 = getShift(ds, config.s3);
      var s4 = getShift(ds, config.s4);
      html += '<div class="master-row">' +
        '<span class="master-date">' + cur.getDate() + ' ' + cur.toLocaleString('default',{month:'short'}) + '</span>' +
        '<span class="badge-shift shift-' + s1.type + '">' + s1.short + '</span>' +
        '<span class="badge-shift shift-' + s2.type + '">' + s2.short + '</span>' +
        '<span class="badge-shift shift-' + s3.type + '">' + s3.short + '</span>' +
        '<span class="badge-shift shift-' + s4.type + '">' + s4.short + '</span>' +
        '</div>';
      cur.setDate(cur.getDate() + 1);
    }
  }
  document.getElementById('masterContent').innerHTML = html;
}

// Render Calendar
function renderCalendar() {
  var y = viewMonth.getFullYear();
  var m = viewMonth.getMonth();
  document.getElementById('calMonthLabel').textContent = 
    new Date(y, m).toLocaleString('default', {month:'long', year:'numeric'});
  
  var grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  
  var firstDay = new Date(y, m, 1);
  var lastDay = new Date(y, m+1, 0);
  var startDow = (firstDay.getDay() + 6) % 7;
  var todayStr = fmtDate(new Date());
  
  for (var i = 0; i < startDow; i++) {
    var empty = document.createElement('div');
    grid.appendChild(empty);
  }
  
  for (var d = 1; d <= lastDay.getDate(); d++) {
    var date = new Date(y, m, d);
    var ds = fmtDate(date);
    var s1 = getShift(ds, config.s1);
    
    var cell = document.createElement('div');
    cell.className = 'cal-cell ' + s1.type;
    if (ds === todayStr) cell.classList.add('today');
    
    cell.innerHTML = '<span class="cal-num">' + d + '</span><span class="cal-shift">' + s1.short + '</span>';
    
    if (notes[ds] && notes[ds].trim() !== '') {
      var dot = document.createElement('span');
      dot.className = 'note-dot';
      cell.appendChild(dot);
    }
    
    (function(dateStr) {
      cell.addEventListener('click', function() { openNote(dateStr); });
    })(ds);
    
    grid.appendChild(cell);
  }
}

// Notes modal
var currentNoteDate = null;
var noteModal = new bootstrap.Modal(document.getElementById('noteModal'));

function openNote(dateStr) {
  currentNoteDate = dateStr;
  document.getElementById('noteTitle').textContent = '📝 ' + dateStr;
  document.getElementById('noteInput').value = notes[dateStr] || '';
  noteModal.show();
}

// Event Listeners
document.getElementById('btnSaveNote').addEventListener('click', function() {
  if (!currentNoteDate) return;
  var text = document.getElementById('noteInput').value.trim();
  if (text) {
    notes[currentNoteDate] = text;
  } else {
    delete notes[currentNoteDate];
  }
  saveData();
  noteModal.hide();
  renderCalendar();
});

document.getElementById('btnDeleteNote').addEventListener('click', function() {
  if (!currentNoteDate) return;
  delete notes[currentNoteDate];
  document.getElementById('noteInput').value = '';
  saveData();
  noteModal.hide();
  renderCalendar();
});

document.getElementById('btnSaveConfig').addEventListener('click', function() {
  config.start = document.getElementById('startDate').value;
  config.end = document.getElementById('endDate').value;
  config.s1 = parseInt(document.getElementById('s1pos').value);
  config.s2 = parseInt(document.getElementById('s2pos').value);
  config.s3 = parseInt(document.getElementById('s3pos').value);
  config.s4 = parseInt(document.getElementById('s4pos').value);
  
  if (!config.start || !config.end) {
    alert('Please fill both dates');
    return;
  }
  if (parseDate(config.end) < parseDate(config.start)) {
    alert('End date must be after start date');
    return;
  }
  
  saveData();
  viewMonth = parseDate(config.start);
  showScreen('screenDashboard');
});

document.getElementById('cardMaster').addEventListener('click', function() {
  showScreen('screenMaster');
});

document.getElementById('cardCalendar').addEventListener('click', function() {
  showScreen('screenCalendar');
});

document.getElementById('btnBackMaster').addEventListener('click', function() {
  showScreen('screenDashboard');
});

document.getElementById('btnBackCal').addEventListener('click', function() {
  showScreen('screenDashboard');
});

document.getElementById('btnMasterPrev').addEventListener('click', function() {
  viewMonth.setMonth(viewMonth.getMonth() - 1);
  renderMaster();
});

document.getElementById('btnMasterNext').addEventListener('click', function() {
  viewMonth.setMonth(viewMonth.getMonth() + 1);
  renderMaster();
});

document.getElementById('btnCalPrev').addEventListener('click', function() {
  viewMonth.setMonth(viewMonth.getMonth() - 1);
  renderCalendar();
});

document.getElementById('btnCalNext').addEventListener('click', function() {
  viewMonth.setMonth(viewMonth.getMonth() + 1);
  renderCalendar();
});

document.getElementById('btnReset').addEventListener('click', function() {
  if (confirm('Yes - Go for reset? This will clear all settings and notes.')) {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
});

document.getElementById('btnExport').addEventListener('click', function() {
  var data = {
    config: config,
    notes: notes,
    exportedAt: new Date().toISOString()
  };
  var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'roster-' + fmtDate(new Date()) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// Initialize
populateDropdowns();
loadData();

if (!localStorage.getItem(STORAGE_KEY)) {
  saveData();
  showScreen('screenSetup');
} else {
  showScreen('screenDashboard');
}

})();
</script>
